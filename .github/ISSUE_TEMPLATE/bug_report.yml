name: 缺陷报告
description: 报告可以稳定复现的问题或异常行为
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交 Cookie、令牌、手机号或其它账号信息。
        本地诊断只应在应用内审阅后由你主动粘贴。
  - type: input
    id: app_version
    attributes:
      label: 应用版本
      description: 可在“关于 → 当前版本”查看，请包含构建号。
      placeholder: 1.3.2-beta.1+114536
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统版本与设备架构
      description: 不想提供设备型号时，只填写系统版本和 arm64-v8a 等架构即可。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明发生了什么，以及它对使用造成的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 本地诊断（可选）
      description: 仅粘贴你在应用内审阅过的内容；请再次确认不含敏感信息。
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除 Cookie、令牌、手机号和其它敏感信息。
          required: true
