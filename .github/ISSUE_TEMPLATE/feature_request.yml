name: 功能建议
description: 提议改善现有体验或增加新的能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实使用场景。PiliPalaZ 不会为了功能引入遥测，
        也不会实现规避平台权益或内容限制的能力。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前遇到了什么问题，哪些用户会从改进中受益？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望看到的交互或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如果完整方案成本过高，哪些简化方式也能解决问题？
  - type: textarea
    id: privacy
    attributes:
      label: 权限、账号与隐私影响
      description: 说明是否需要新增权限、账号写操作、后台任务或外部服务。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 此建议不依赖规避平台权益，也不要求收集用户数据。
          required: true
