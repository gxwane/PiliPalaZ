import com.android.build.OutputFile

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def _storeFile = file(System.getenv("KEYSTORE") ?: keystoreProperties["storeFile"] ?: "vvex.jks")
def _storePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties["storePassword"]
def _keyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties["keyAlias"]
def _keyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties["keyPassword"]

android {
    compileSdk = flutter.compileSdkVersion

    namespace = 'io.github.gxwane.pilipalaz'
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        encoding = "UTF-8"
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "io.github.gxwane.pilipalaz"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        minSdk = flutter.minSdkVersion
        multiDexEnabled = true
    }

    signingConfigs {
        // 添加签名配置
        release {
            // 配置密钥库文件的位置、别名、密码等信息
            storeFile = _storeFile
            storePassword = _storePassword
            keyAlias = _keyAlias
            keyPassword = _keyPassword
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
        }
        debug {
            // applicationId "io.github.gxwane.pilipalaz.debug"
            applicationIdSuffix = ".debug"
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    api 'androidx.annotation:annotation:1.9.0'
    implementation 'androidx.core:core:1.17.0'
    api 'org.conscrypt:conscrypt-android:2.5.2'
}

def abiCodes = [
    "x86_64": 1,
    "armeabi-v7a": 2,
    "arm64-v8a": 3,
]

// Flutter 3.38 still rewrites split version codes through the legacy variant
// API (flutter/flutter#166550), so this normalization must run after Flutter's
// own listener until that upstream migration is complete.
android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abiCode = abiCodes[output.getFilter(OutputFile.ABI)]
        if (abiCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiCode
        }
    }
}
